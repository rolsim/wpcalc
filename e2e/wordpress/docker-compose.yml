# WordPress integration stack for the e2e test.
#
# The mounted plugin is the one `wpcalc plugin export` produces, not the source
# directory. That way this suite exercises the artifact a tester actually
# receives: if the export ever stops producing a working plugin, these tests
# fail rather than passing against a directory nobody ships.
#
# .export/ is created by the test before compose starts, and gitignored.

name: wpcalc-e2e

services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: rootpw
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 30

  wordpress:
    image: wordpress:php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8099:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DEBUG: "1"
    volumes:
      - wp:/var/www/html
      - ./.export/wpcalc:/var/www/html/wp-content/plugins/wpcalc
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/ >/dev/null || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 40

  # wp-cli shares the WordPress volume so it operates on the same install.
  wpcli:
    image: wordpress:cli-php8.3
    depends_on:
      wordpress:
        condition: service_healthy
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
    volumes:
      - wp:/var/www/html
      - ./.export/wpcalc:/var/www/html/wp-content/plugins/wpcalc
    entrypoint: ["tail", "-f", "/dev/null"]

volumes:
  wp:
