# WordPress integration stack for the e2e test.
#
# The plugin directory is bind-mounted rather than copied so the test can build
# a fresh binary into wordpress/wpcalc/bin and have the container pick it up
# without an image rebuild. That binary is the same CGO_ENABLED=0 artifact the
# Makefile produces, which is the whole point of forbidding cgo.

name: wpcalc-e2e

services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: rootpw
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 30

  wordpress:
    image: wordpress:php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8099:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DEBUG: "1"
    volumes:
      - wp:/var/www/html
      - ../../wordpress/wpcalc:/var/www/html/wp-content/plugins/wpcalc
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/ >/dev/null || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 40

  # wp-cli shares the WordPress volume so it operates on the same install.
  wpcli:
    image: wordpress:cli-php8.3
    depends_on:
      wordpress:
        condition: service_healthy
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
    volumes:
      - wp:/var/www/html
      - ../../wordpress/wpcalc:/var/www/html/wp-content/plugins/wpcalc
    entrypoint: ["tail", "-f", "/dev/null"]

volumes:
  wp:
