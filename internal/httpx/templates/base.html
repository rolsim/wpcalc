<!DOCTYPE html>
<html lang="{{ .Lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Title }} — {{ .T "app.title" }}</title>
  <link rel="stylesheet" href="{{ .URL "/static/app.css" }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ .URL "/" }}">{{ .T "app.title" }}</a>
    <nav>
      <a href="{{ .URL "/" }}">{{ .T "nav.grid" }}</a>
      <a href="{{ .URL "/employees" }}">{{ .T "nav.employees" }}</a>
      <a href="{{ .URL "/reports" }}">{{ .T "nav.reports" }}</a>
    </nav>
    {{ if .LoggedIn }}
      <form class="logout" method="post" action="{{ .URL "/logout" }}">
        <span class="whoami">{{ .Identity.Username }}</span>
        <button type="submit">{{ .T "auth.logout" }}</button>
      </form>
    {{ end }}
  </header>

  <main>
    {{ if .Error }}<div class="alert alert-error" role="alert">{{ .Error }}</div>{{ end }}
    {{ if .Flash }}<div class="alert alert-ok" role="status">{{ .Flash }}</div>{{ end }}
    {{ template "content" . }}
  </main>

  <script src="{{ .URL "/static/app.js" }}" defer></script>
</body>
</html>
