<!DOCTYPE html>
<html lang="{{ .Lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Title }} — {{ .T "app.title" }}</title>
  <link rel="stylesheet" href="{{ .URL "/static/app.css" }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ .URL "/" }}">{{ .T "app.title" }}</a>
    <nav>
      <a href="{{ .URL "/" }}">{{ .T "nav.grid" }}</a>
      <a href="{{ .URL "/employees" }}">{{ .T "nav.employees" }}</a>
      <a href="{{ .URL "/reports" }}">{{ .T "nav.reports" }}</a>
    </nav>
    <div class="topbar-right">
      {{ if .Languages }}
        <form class="lang-form" method="post" action="{{ .LanguageURL }}">
          <input type="hidden" name="return_to" value="{{ .CurrentPath }}">
          <label class="visually-hidden" for="lang-select">{{ .T "lang.label" }}</label>
          <select id="lang-select" name="lang" data-autosubmit>
            {{ range .Languages }}
              <option value="{{ .Tag }}"{{ if .Selected }} selected{{ end }}>{{ .Label }}</option>
            {{ end }}
          </select>
          <button type="submit">{{ .T "lang.save" }}</button>
        </form>
      {{ end }}
      {{ if .LoggedIn }}
      <form class="logout" method="post" action="{{ .URL "/logout" }}">
        <span class="whoami">{{ .Identity.Username }}</span>
        <button type="submit">{{ .T "auth.logout" }}</button>
      </form>
      {{ end }}
    </div>
  </header>

  <main>
    {{ if .Error }}<div class="alert alert-error" role="alert">{{ .Error }}</div>{{ end }}
    {{ if .Flash }}<div class="alert alert-ok" role="status">{{ .Flash }}</div>{{ end }}
    {{ template "content" . }}
  </main>

  <script src="{{ .URL "/static/app.js" }}" defer></script>
</body>
</html>
