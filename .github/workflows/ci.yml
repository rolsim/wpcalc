name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"

      - name: Install golangci-lint
        # go install rather than the prebuilt-binary install script, so the
        # linter is built with the toolchain above: a golangci-lint whose
        # go/analysis predates this module's `go` directive does not fail
        # loudly, it silently reports fake `undefined:` errors for code that
        # `go build` and `go vet` compile cleanly. Bumping the go directive
        # means bumping this pin in the same commit. v2 also requires the v2
        # `.golangci.yml` schema (`version: "2"`); the two move together.
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2

      - name: make check-all
        run: make check-all
