name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    env:
      CGO_ENABLED: 0
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - name: Build
        run: |
          set -eu
          ext=""
          if [ "${GOOS}" = "windows" ]; then ext=".exe"; fi
          out="wpcalc${ext}"
          go build -ldflags "-X main.version=${GITHUB_REF_NAME}" -o "${out}" ./cmd/wpcalc

          archive="wpcalc-${GITHUB_REF_NAME}-${GOOS}-${GOARCH}"
          if [ "${GOOS}" = "windows" ]; then
            zip "${archive}.zip" "${out}"
            echo "ASSET=${archive}.zip" >> "$GITHUB_ENV"
          else
            tar -czf "${archive}.tar.gz" "${out}"
            echo "ASSET=${archive}.tar.gz" >> "$GITHUB_ENV"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > checksums.txt

      - name: Detect prerelease
        id: prerelease
        run: |
          # Semver convention: a hyphen introduces a prerelease identifier,
          # e.g. v0.0.1-alpha, v1.0.0-rc.1. Plain vX.Y.Z is a stable release.
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "flag=true" >> "$GITHUB_OUTPUT"
          else
            echo "flag=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ steps.prerelease.outputs.flag }}
