name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Tagging is independent of ci.yml, so nothing otherwise stops a tag on a
  # broken commit from being built and published. Gate here instead of
  # trusting that CI already ran and passed for this exact commit.
  check:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - name: Install golangci-lint
        # go install rather than the prebuilt-binary install script: the
        # prebuilt v1.64.8 release was compiled with go1.24, which refuses to
        # lint a go1.26 module. Building it locally uses the toolchain above.
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8

      - name: make check-all
        run: make check-all

  build:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    env:
      CGO_ENABLED: 0
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - name: Build
        run: |
          set -eu
          ext=""
          if [ "${GOOS}" = "windows" ]; then ext=".exe"; fi

          archive() {
            name="$1" # server | ctl
            bin="$2"  # path to the built binary
            asset="${name}-${GITHUB_REF_NAME}-${GOOS}-${GOARCH}"
            if [ "${GOOS}" = "windows" ]; then
              zip -q "${asset}.zip" "${bin}"
              echo "${asset}.zip"
            else
              tar -czf "${asset}.tar.gz" "${bin}"
              echo "${asset}.tar.gz"
            fi
          }

          out_server="wpcalc${ext}"
          go build -ldflags "-X main.version=${GITHUB_REF_NAME}" -o "${out_server}" ./cmd/wpcalc
          echo "SERVER_ASSET=$(archive wpcalc "${out_server}")" >> "$GITHUB_ENV"

          out_cli="wpcalcctl${ext}"
          (cd cmd/wpcalcctl && go build -o "../../${out_cli}" .)
          echo "CLI_ASSET=$(archive wpcalcctl "${out_cli}")" >> "$GITHUB_ENV"

      - name: Upload wpcalc artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SERVER_ASSET }}
          path: ${{ env.SERVER_ASSET }}
          retention-days: 1

      - name: Upload wpcalcctl artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CLI_ASSET }}
          path: ${{ env.CLI_ASSET }}
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > checksums.txt

      - name: Detect prerelease
        id: prerelease
        run: |
          # Semver convention: a hyphen introduces a prerelease identifier,
          # e.g. v0.0.1-alpha, v1.0.0-rc.1. Plain vX.Y.Z is a stable release.
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "flag=true" >> "$GITHUB_OUTPUT"
          else
            echo "flag=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ steps.prerelease.outputs.flag }}
