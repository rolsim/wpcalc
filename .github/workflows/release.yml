name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Tagging is independent of ci.yml, so nothing otherwise stops a tag on a
  # broken commit from being built and published. Gate here instead of
  # trusting that CI already ran and passed for this exact commit.
  check:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - name: Install golangci-lint
        # go install rather than the prebuilt-binary install script: the
        # prebuilt v1.64.8 release was compiled with go1.24, which refuses to
        # lint a go1.26 module. Building it locally uses the toolchain above.
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8

      - name: make check-all
        run: make check-all

  build:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    env:
      CGO_ENABLED: 0
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - name: Build
        run: |
          set -eu
          ext=""
          if [ "${GOOS}" = "windows" ]; then ext=".exe"; fi

          archive() {
            name="$1" # server | ctl
            bin="$2"  # path to the built binary
            asset="${name}-${GITHUB_REF_NAME}-${GOOS}-${GOARCH}"
            if [ "${GOOS}" = "windows" ]; then
              zip -q "${asset}.zip" "${bin}"
              echo "${asset}.zip"
            else
              tar -czf "${asset}.tar.gz" "${bin}"
              echo "${asset}.tar.gz"
            fi
          }

          out_server="wpcalc${ext}"
          go build -ldflags "-X main.version=${GITHUB_REF_NAME}" -o "${out_server}" ./cmd/wpcalc
          echo "SERVER_ASSET=$(archive wpcalc "${out_server}")" >> "$GITHUB_ENV"

          out_cli="wpcalcctl${ext}"
          (cd cmd/wpcalcctl && go build -o "../../${out_cli}" .)
          echo "CLI_ASSET=$(archive wpcalcctl "${out_cli}")" >> "$GITHUB_ENV"

      - name: Upload wpcalc artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SERVER_ASSET }}
          path: ${{ env.SERVER_ASSET }}
          retention-days: 1

      - name: Upload wpcalcctl artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CLI_ASSET }}
          path: ${{ env.CLI_ASSET }}
          retention-days: 1

      # A ready-to-upload WordPress plugin zip, for hosts where the only way
      # in is the admin "Upload Plugin" screen — no shell, no `wpcalc plugin
      # export`. `plugin export` embeds a copy of the binary that runs it, so
      # this only works on the leg whose GOOS/GOARCH the runner can execute
      # natively; linux/amd64 covers the shared-hosting case this is for.
      - name: Build WordPress plugin zip
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          set -eu
          chmod +x wpcalc
          ./wpcalc plugin export pluginbuild
          asset="wpcalc-wordpress-plugin-${GITHUB_REF_NAME}-${GOOS}-${GOARCH}.zip"
          (cd pluginbuild && zip -qr "../${asset}" wpcalc)
          echo "PLUGIN_ASSET=${asset}" >> "$GITHUB_ENV"

      - name: Upload WordPress plugin artifact
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_ASSET }}
          path: ${{ env.PLUGIN_ASSET }}
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > checksums.txt

      - name: Detect prerelease
        id: prerelease
        run: |
          # Semver convention: a hyphen introduces a prerelease identifier,
          # e.g. v0.0.1-alpha, v1.0.0-rc.1. Plain vX.Y.Z is a stable release.
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "flag=true" >> "$GITHUB_OUTPUT"
          else
            echo "flag=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Changelog
        # softprops/action-gh-release's generate_release_notes relies on
        # merged PRs, which this repo doesn't use (pushes land on main
        # directly) — it produces an empty changelog. Build one from commit
        # subjects between the previous tag and this one instead.
        run: |
          set -eu
          prev_tag="$(git tag --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}$" | head -1 || true)"
          {
            echo "## Changelog"
            echo
            if [ -n "${prev_tag}" ]; then
              git log --pretty='format:- %s (%h)' "${prev_tag}..${GITHUB_REF_NAME}"
            else
              git log --pretty='format:- %s (%h)' "${GITHUB_REF_NAME}"
            fi
            echo
            echo
            if [ -n "${prev_tag}" ]; then
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${prev_tag}...${GITHUB_REF_NAME}"
            fi
          } > changelog.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: changelog.md
          prerelease: ${{ steps.prerelease.outputs.flag }}
